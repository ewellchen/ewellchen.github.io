      items:
        - '<a href="/publications/#chen2025r2d2">The R2D2 deep neural network series for scalable non-Cartesian magnetic resonance imaging</a>. Y. Chen, A. Aghabiglou, S. Chen, M. Torki, C. Tang, R. B. van Heeswijk, and Y. Wiaux. arXiv preprint, 2025.'
        - '<a href="/publications/#chen2023compact">A compact upconversion single-photon imager for full-range and accurate 3-D imaging</a>. Y. Chen, C. Jiang, Y. Liu, H. Su, X. Hu, and Y. Pan. <em>IEEE Transactions on Instrumentation and Measurement</em>, 2023.'
