        - '<a href="/publications/#yan2025quantum">Quantum-inspired multimodal fusion with Lindblad master equation for sentiment analysis</a>. K. Yan, P. Lai, Y. Yang, Y. Ren, T. Badarch, Y. Chen, and X. Zheng. <em>Neurocomputing</em>, 2025.'
