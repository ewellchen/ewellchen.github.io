- title: Research Directions
  type: nested_list
  contents:
    - title: Quantum Machine Learning
      items:
        - '<a href="/publications/#chen2026hamiltonian">Hamiltonian-induced error-channel control for Lyapunov quantum state transfer</a>. Y. Chen, X. Lang, and J. Wu. <em>Physical Review A</em>, 2026.'
        - Quantum-inspired neural networks, tensor-network models, and quantum-state analysis.
        - Multimodal learning, language modeling, and efficient machine learning methods.
    - title: Single-Photon and Computational Imaging
      items:
        - '<a href="/publications/#chen2026sensor">Sensor-aware physical modelling for deep learning-based single-photon imaging</a>. Y. Chen, X. Lang, and Y. Pan. <em>Optics Express</em>, 2026.'
        - Photon-efficient 3D sensing and self-supervised image reconstruction.
        - Magnetic resonance imaging and image-to-point-cloud registration.
    - title: Industrial Signal Processing
      items:
        - '<a href="/publications/#lang2026visual">Visual-frequency bimodal fusion networks for oscillation detection and quantification in industrial control loops</a>. X. Lang, L. Yang, J. Wu, Y. Chen, J. Na, and C. Lei. <em>Engineering Applications of Artificial Intelligence</em>, 2026.'
        - Industrial oscillation detection, root-cause diagnosis, and control-loop performance.
        - Soft sensing, remaining useful life prediction, and learning-based control.

